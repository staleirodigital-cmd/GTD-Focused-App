const options=[['d','Objetos','Busca tátil, pequenos objetos ilustrados e uma presença mais humana.','Uma direção inspirada no cuidado do Airbnb: materiais, luz e volume nos ícones; listas continuam simples e livres. Ilustrações vetoriais próprias, ainda como estudo de linguagem.'],['a','Presença','Silhuetas fortes, uma cor por referência e um fundo que recua.','A mais direta: a personalidade vem das silhuetas e do contraste entre destinos expressivos e contextos discretos.'],['b','Matéria','Uma paleta mineral, traços abertos e um ritmo mais tranquilo.','A mais acolhedora: o desenho evoca folhas e marcas do papel, sem textura nem imitação de um caderno.'],['c','Horizonte','Formas envolventes, cores translúcidas e uma composição fluida.','A mais suave: uma mesma geometria aproxima os símbolos e a busca. A cor cria uma profundidade leve.']];
