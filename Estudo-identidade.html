<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clareza · três direções de identidade</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eceef1;color:#242933}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit;background:none}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #4388cf;outline-offset:3px}header,footer{max-width:1320px;margin:auto;padding:32px 28px}header{display:flex;justify-content:space-between;gap:24px;align-items:center}h1{font-size:25px;letter-spacing:-.8px;margin:6px 0}header p,footer{font-size:13px;color:#69717e;line-height:1.6}.eyebrow{font-size:10px;letter-spacing:1.8px;text-transform:uppercase}.controls{display:flex;gap:8px}.controls button{padding:11px 15px;background:#fff;border-radius:20px;font-size:13px}.tabs{display:none}.board{max-width:1320px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:0 28px}h2{font-size:19px;margin:3px 0 7px;letter-spacing:-.4px}.intro{min-height:78px}.intro p{font-size:12px;color:#69717e;line-height:1.5;margin:0}.screen{--bg:#fff;--text:#242830;--muted:#858c98;--line:#e7eaf0;--field:#f0f2f6;--selected:#eaf2fe;background:var(--bg);color:var(--text);min-height:760px;border:1px solid #0000000d;border-radius:28px;padding:25px 18px 14px;display:flex;flex-direction:column;box-shadow:0 12px 35px #162c4510}.search{display:flex;align-items:center;gap:10px;padding:0 15px;height:44px;background:var(--field);border-radius:24px;margin-bottom:22px;color:var(--muted)}.search svg{width:20px;height:20px;flex:none}.search input{width:100%;min-width:0;border:0;outline:none;background:none;color:var(--text);font-size:15px}.search input::placeholder{color:var(--muted)}nav{flex:1}.entry{width:100%;display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 10px;text-align:left;border-radius:10px;line-height:1.3}.label{flex:1;min-width:0;font-size:16px;font-weight:560;letter-spacing:-.25px}.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.symbol{display:flex;align-items:center;justify-content:center;width:26px;height:28px;flex:none}.symbol svg{width:26px;height:26px;overflow:visible}.child .symbol{color:var(--muted)}.child .symbol svg{width:21px;height:21px}.child .label{font-weight:400}.group{margin:20px 0}.group+.group{margin-top:24px}.entry[aria-pressed=true]{background:var(--selected)}.entry[aria-pressed=true] .label{color:var(--text)}.inbox .symbol{color:#2b9cd2}.next .symbol{color:#ca9b20}.waiting .symbol{color:#b28b62}.someday .symbol{color:#71a196}.projects .symbol{color:#8d89c7}.bottom{border-top:1px solid var(--line);margin-top:22px;display:flex;justify-content:space-between;align-items:center;padding-top:10px;color:var(--muted);font-size:13px}.bottom button{min-height:44px}.bottom svg{width:20px;height:20px}.caption{font-size:12px;line-height:1.6;color:#69717e;margin:16px 2px}.b{--bg:#fcfaf6;--text:#343332;--field:#f0ece4;--selected:#eee8dc;--line:#e4dfd5;--muted:#918a7e}.b .search{border-radius:11px;height:46px;background:none;border-bottom:1px solid var(--line);padding:0 10px;margin-bottom:24px}.b .label{font-weight:540;letter-spacing:-.35px}.b .child .label{font-weight:400}.b .entry{border-radius:6px;min-height:50px}.b .next .symbol{color:#c17b4c}.b .inbox .symbol{color:#708d9b}.b .someday .symbol{color:#8d9b6d}.b .projects .symbol{color:#a48686}.c{--bg:#f9fbff;--text:#27334b;--field:#eaf0f8;--selected:#e4edf9;--muted:#8a96a9;--line:#dfe7f2}.c .search{border-radius:14px;margin-bottom:20px}.c .entry{min-height:47px}.c .label{font-weight:550;letter-spacing:-.4px}.c .child .label{font-weight:400}.c .group{margin:24px 0}.c .group .entry:first-child{margin-bottom:4px}.c .symbol svg{width:27px;height:27px}.c .child .symbol svg{width:20px;height:20px}.c .inbox .symbol{color:#528fc6}.c .next .symbol{color:#6a92cd}.c .waiting .symbol{color:#aa8fbb}.c .someday .symbol{color:#6bada4}.c .projects .symbol{color:#a58cc9}.empty{font-size:13px;padding:16px;color:var(--muted)}.detail{display:none;flex:1;padding:4px 10px}.detail h3{font-size:25px;font-weight:550;letter-spacing:-.7px;line-height:1.25;margin:25px 0 18px}.detail p{font-size:14px;line-height:1.8;color:var(--muted)}.back{font-size:14px;color:var(--muted);min-height:44px;padding:0}.detail hr{border:0;border-top:1px solid var(--line);margin:25px 0}.demo-note{font-size:11px!important}.screen.open nav,.screen.open .search{display:none}.screen.open .detail{display:block}.screen.open .bottom{margin-top:auto}.detail-item{padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}.dark{background:#111419;color:#e6e9f0}.dark header p,.dark .intro p,.dark .caption,.dark footer{color:#9ba3b0}.dark .controls button{background:#282d36}.dark .a{--bg:#101214;--text:#e3e6ed;--muted:#89919e;--field:#23272d;--selected:#253344;--line:#292d34}.dark .b{--bg:#242320;--text:#ece8df;--muted:#a59d90;--field:#302d27;--selected:#39342b;--line:#423c32}.dark .c{--bg:#171e2b;--text:#e1e9f7;--muted:#93a1b8;--field:#242f43;--selected:#2a3a55;--line:#303d53}@media(hover:hover){.entry:hover{background:var(--field)}}@media(max-width:800px){header{padding:25px 20px 16px;align-items:flex-start}header h1{font-size:23px}.controls button{font-size:12px;padding:10px}header p{max-width:250px}.board{display:block;padding:0 12px}.option{display:none}.option.visible{display:block}.intro{padding:8px 12px;min-height:70px}.screen{border-radius:22px;min-height:740px;padding:22px 18px 12px}.tabs{display:flex;gap:5px;margin:0 20px 16px;background:#dfe3e9;padding:4px;border-radius:12px}.tabs button{flex:1;min-height:40px;border-radius:9px;font-size:13px}.tabs button[aria-pressed=true]{background:#fff;box-shadow:0 2px 4px #0001}.dark .tabs{background:#252b35}.dark .tabs button[aria-pressed=true]{background:#414b5b}.caption{margin:16px 12px}footer{padding:12px 24px 28px}.label{font-size:17px}.entry{min-height:50px}.b .entry{min-height:52px}}@media(prefers-reduced-motion:no-preference){.entry{transition:background 130ms}.detail{animation:appear 160ms ease-out}@keyframes appear{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style><header><div><span class="eyebrow">Clareza · estudo de identidade</span><h1>Uma essência. Três expressões.</h1><p>Compare o conjunto. As mesmas listas, com três linguagens visuais próprias.</p></div><div class="controls"><button id="theme" aria-pressed="false">Ver no escuro</button></div></header><div class="tabs" aria-label="Escolher direção"><button data-tab="a" aria-pressed="true">A · Presença</button><button data-tab="b" aria-pressed="false">B · Matéria</button><button data-tab="c" aria-pressed="false">C · Horizonte</button></div><main class="board" id="board"></main><footer>Estudo visual separado do aplicativo. Busca e abertura de listas são demonstrativas; nenhum dado pessoal é acessado ou alterado. <a href="Clareza.html">Voltar ao Clareza</a></footer><script>
const paths={
a:{inbox:'<path d="M4 5h16v14H4z" fill="currentColor"/><path d="M7 8h10v5h-3l-2 3-2-3H7z" fill="var(--bg)"/>',next:'<path d="M4 5h7l9 7-9 7H4l9-7z" fill="currentColor"/>',waiting:'<rect x="5" y="3" width="14" height="18" rx="5" fill="currentColor"/><path d="M12 7v6l3 2" stroke="var(--bg)" stroke-width="2" fill="none"/>',someday:'<path d="M4 17C4 7 12 3 21 5c-1 10-6 16-13 14" fill="currentColor"/><path d="m6 19 9-9" stroke="var(--bg)" stroke-width="1.6"/>',projects:'<path d="M3 7h7l3-3h8v16H3z" fill="currentColor"/><path d="M6 11h12M6 15h8" stroke="var(--bg)" stroke-width="1.5"/>'},
b:{inbox:'<path d="M4 7h16v13H4z" fill="currentColor" opacity=".3"/><path d="m4 7 4-4h12v13H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 11h6" stroke="currentColor" stroke-width="1.6"/>',next:'<path d="M5 19 10 5h10L15 19z" fill="currentColor" opacity=".3"/><path d="M5 19 10 5h10L15 19zM9 15l7-7" fill="none" stroke="currentColor" stroke-width="1.8"/>',waiting:'<path d="M6 3h12v18H6z" fill="currentColor" opacity=".25"/><path d="M6 3h12M6 21h12M8 4c0 5 8 11 8 16M16 4c0 5-8 11-8 16" fill="none" stroke="currentColor" stroke-width="1.7"/>',someday:'<path d="M5 19V6c8-1 14 3 14 13z" fill="currentColor" opacity=".25"/><path d="M5 19V6c8-1 14 3 14 13M5 19l7-7" fill="none" stroke="currentColor" stroke-width="1.8"/>',projects:'<path d="M5 4h13v16H5z" fill="currentColor" opacity=".25"/><path d="M8 4h10v16H5V4h3v16M11 8h4" fill="none" stroke="currentColor" stroke-width="1.7"/>'},
c:{inbox:'<rect x="3" y="4" width="18" height="17" rx="6" fill="currentColor" opacity=".22"/><path d="M6 10h12v7H6z" fill="currentColor"/><path d="M9 6h6v7H9z" fill="var(--bg)"/>',next:'<rect x="3" y="3" width="18" height="18" rx="6" fill="currentColor" opacity=".22"/><path d="m8 7 8 5-8 5z" fill="currentColor"/>',waiting:'<rect x="3" y="3" width="18" height="18" rx="6" fill="currentColor" opacity=".22"/><path d="M9 8v8M15 8v8" stroke="currentColor" stroke-width="3"/>',someday:'<rect x="3" y="3" width="18" height="18" rx="6" fill="currentColor" opacity=".22"/><path d="M6 15a6 6 0 0 1 12 0z" fill="currentColor"/><path d="M6 18h12" stroke="currentColor" stroke-width="1.6"/>',projects:'<rect x="3" y="3" width="18" height="18" rx="6" fill="currentColor" opacity=".22"/><path d="M7 8h10v3H7zM7 13h7v3H7z" fill="currentColor"/>'}}
const icons=(id,v)=>`<svg viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round">${id==='child'?(v==='a'?'<path d="M5 7h14M5 12h14M5 17h9" stroke="currentColor" stroke-width="1.8"/>':v==='b'?'<path d="M7 4h11v16H7zM10 9h5M10 13h5" stroke="currentColor" stroke-width="1.5" fill="none"/>':'<path d="M6 6h12v12H6z" fill="currentColor" opacity=".3"/><path d="M9 10h6M9 14h4" stroke="currentColor" stroke-width="1.5"/>'):paths[v][id]}</svg>`;
const options=[['a','Presença','Silhuetas fortes, uma cor por referência e um fundo que recua.','A mais direta: a personalidade vem das silhuetas e do contraste entre destinos expressivos e contextos discretos.'],['b','Matéria','Uma paleta mineral, traços abertos e um ritmo mais tranquilo.','A mais acolhedora: o desenho evoca folhas e marcas do papel, sem textura nem imitação de um caderno.'],['c','Horizonte','Formas envolventes, cores translúcidas e uma composição fluida.','A mais suave: uma mesma geometria aproxima os símbolos e a busca. A cor cria uma profundidade leve.']];
const lists=[['inbox','Inbox','3'],['next','Próximas ações','5'],['child','Na rua','1'],['child','Conversar com Ana','1'],['child','Em casa',''],['child','No telefone',''],['child','No computador','3'],['waiting','Aguardando','1'],['someday','Algum dia / Talvez','2'],['projects','Projetos','2']];
const searchIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>';
const settingsIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--bg)"/><circle cx="15" cy="17" r="3" fill="var(--bg)"/></svg>';
function row([id,name,n],v){return `<button class="entry ${id}" data-name="${name}" aria-pressed="${name==='Inbox'}"><span class="symbol">${icons(id,v)}</span><span class="label">${name}</span><span class="count">${n}</span></button>`}
document.querySelector('#board').innerHTML=options.map(([v,name,desc,note],i)=>`<section class="option ${i===0?'visible':''}" data-option="${v}"><div class="intro"><h2>${v.toUpperCase()} · ${name}</h2><p>${desc}</p></div><div class="screen ${v}"><label class="search">${searchIcon}<input placeholder="Buscar em tudo" aria-label="Buscar nas listas da proposta ${v.toUpperCase()}"></label><nav aria-label="Listas da proposta ${v.toUpperCase()}">${row(lists[0],v)}<div class="group">${lists.slice(1,7).map(l=>row(l,v)).join('')}</div>${lists.slice(7).map(l=>row(l,v)).join('')}<p class="empty" hidden>Nenhuma lista encontrada.</p></nav><div class="detail"><button class="back">← Suas listas</button><h3></h3><p class="detail-copy"></p><div class="detail-items"></div><hr><p class="demo-note">Prévia de composição. Seus registros ficam no aplicativo.</p></div><div class="bottom"><button class="new">＋ Nova lista</button><button class="settings" aria-label="Sobre este estudo">${settingsIcon}</button></div></div><p class="caption">${note}</p></section>`).join('');
const samples={'Inbox':['Levar o carro à oficina','Ideia de uma viagem em novembro','Artigo sobre iluminação natural'],'Na rua':['Buscar o casaco na lavanderia'],'No computador':['Separar referências para a sala','Enviar os documentos ao contador','Pesquisar opções de hospedagem'],'Projetos':['Carro revisado','Sala pronta para receber amigos']};
document.querySelectorAll('.screen').forEach(screen=>{const nav=screen.querySelector('nav'),input=screen.querySelector('input');input.oninput=()=>{let count=0;nav.querySelectorAll('.entry').forEach(b=>{b.hidden=!b.dataset.name.toLocaleLowerCase().includes(input.value.toLocaleLowerCase());b.style.display=b.hidden?'none':'';if(!b.hidden)count++});nav.querySelector('.empty').hidden=count>0};screen.querySelectorAll('.entry').forEach(b=>b.onclick=()=>{nav.querySelectorAll('.entry').forEach(x=>x.setAttribute('aria-pressed',x===b));screen.querySelector('h3').textContent=b.dataset.name;screen.querySelector('.detail-copy').textContent='';screen.querySelector('.detail-items').replaceChildren(...(samples[b.dataset.name]||['Nenhum registro nesta prévia.']).map(t=>{const el=document.createElement('div');el.className='detail-item';el.textContent=t;return el}));screen.classList.add('open');screen.querySelector('.back').focus({preventScroll:true})});screen.querySelector('.back').onclick=()=>{screen.classList.remove('open');nav.querySelector('[aria-pressed=true]')?.focus({preventScroll:true})};screen.querySelector('.new').onclick=()=>{screen.classList.add('open');screen.querySelector('h3').textContent='Uma lista do seu jeito';screen.querySelector('.detail-copy').textContent='No aplicativo, você escolhe o nome e onde ela fica. Aqui estamos comparando a linguagem visual.';screen.querySelector('.detail-items').replaceChildren()};screen.querySelector('.settings').onclick=()=>{screen.classList.add('open');screen.querySelector('h3').textContent='Estudo de identidade';screen.querySelector('.detail-copy').textContent='As três propostas mantêm as mesmas listas e o mesmo modelo livre. Nenhuma configuração ou dado pessoal é alterado.';screen.querySelector('.detail-items').replaceChildren()}});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(t=>t.setAttribute('aria-pressed',t===b));document.querySelectorAll('[data-option]').forEach(p=>p.classList.toggle('visible',p.dataset.option===b.dataset.tab))});let dark=matchMedia('(prefers-color-scheme:dark)').matches;function theme(){document.body.classList.toggle('dark',dark);document.querySelector('#theme').textContent=dark?'Ver no claro':'Ver no escuro';document.querySelector('#theme').setAttribute('aria-pressed',dark)}document.querySelector('#theme').onclick=()=>{dark=!dark;theme()};theme();
</script></html>
