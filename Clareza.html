function migrate(input){const data=JSON.parse(JSON.stringify(input));if(data.version===2)return data;if(data.version!==1||!Array.isArray(data.lists)||!Array.isArray(data.items))throw Error('Formato desconhecido');const legacy={next:'Próximas ações',projects:'Projetos',waiting:'Aguardando',someday:'Algum dia / Talvez',reference:'Referência'};for(const [id,name] of Object.entries(legacy))if(!data.lists.some(l=>l.id===id))data.lists.push({id,name});for(const l of data.lists){l.parent=l.id==='inbox'||Object.hasOwn(legacy,l.id)?null:l.parent||l.group||null;if(l.parent===l.id)l.parent=null;l.icon=Object.hasOwn(legacy,l.id)?l.id:l.id==='inbox'?'inbox':'list';delete l.group}data.version=2;delete data.contextsReady;return data}
function groupOf(id){const seen=new Set();while(id&&!seen.has(id)){seen.add(id);const l=state.lists.find(l=>l.id===id);if(!l)return null;if(l.parent==null)return l.id;id=l.parent}return null}

function normalizeSearch(value){return String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().replace(/#/g,'').trim()}
function editDistance(a,b){const row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prior=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const old=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prior+(a[i-1]===b[j-1]?0:1));prior=old}}return row[b.length]}

function assistant(i){$('#assistantSlot').innerHTML=`<section class="assistant"><h3>✧ Um espaço para esclarecer</h3><div class="demo-label">DEMONSTRAÇÃO DE INTERAÇÃO · SEM MODELO DE IA CONECTADO</div><p>O que ainda falta resolver sobre isso? Você pode anotar o que já aconteceu ou o resultado que quer alcançar.</p><textarea id="reflection" aria-label="Sua reflexão" placeholder="O que isso significa para você?"></textarea><div class="assistant-actions"><button id="keepReflection">Guardar como nota</button><button id="useAsTitle">Usar como título</button><button id="dismissAssistant">Fechar</button></div><p>Você decide o significado. Nenhuma ação será criada automaticamente.</p></section>`;$('#reflection').focus();$('#dismissAssistant').onclick=()=>$('#assistantSlot').innerHTML='';$('#keepReflection').onclick=()=>{const t=$('#reflection').value.trim();if(!t)return;i.note=[i.note?.trim(),t].filter(Boolean).join('\n\n');save();drawEditor();toast('Reflexão guardada')};$('#useAsTitle').onclick=()=>{const t=$('#reflection').value.trim();if(!t)return;i.title=t;save();drawEditor()}}
function newList(location=null,options={}){if(typeof location!=='string'||location==='space'||location==='inbox'||!state.lists.some(l=>l.id===location))location=null;const draft={name:options.name||'',parent:location};const cancel=()=>{close(utility);options.onCancel?.()};const show=()=>{modal(utility,frame('Nova lista',`<input class="list-name-input" id="listName" placeholder="Como você quer chamar?" aria-label="Nome da lista" maxlength="100"><button class="location-summary" id="listLocation"><span>Dentro de</span><strong>${E(locationName(draft.parent))}</strong><span aria-hidden="true">⌄</span></button><div class="form-actions"><button class="primary-button" id="createList">Criar lista</button></div>`));utility.querySelector('[data-close]').onclick=cancel;utility.oncancel=e=>{e.preventDefault();cancel()};$('#listName').value=draft.name;$('#listName').oninput=e=>draft.name=e.target.value;$('#listLocation').onclick=()=>chooseLocation(draft.parent,null,id=>{draft.parent=id;show()},show);const commit=()=>{const name=draft.name.trim();if(!name){$('#listName').focus();return}const id=uid();state.lists.push({id,name,parent:draft.parent,icon:'list'});if(!save()){state.lists=state.lists.filter(l=>l.id!==id);return}close(utility);if(options.onCreated)options.onCreated(id);else navigate(id);toast('Lista criada')};$('#createList').onclick=commit;$('#listName').onkeydown=e=>{if(e.key==='Enter')commit()};setTimeout(()=>$('#listName')?.focus(),20)};show()}
function search(){modal(utility,frame('Buscar',`<input class="text-field" id="searchInput" placeholder="Listas, ideias, ações…" aria-label="Buscar"><div id="results"></div>`));wireClose(utility);$('#searchInput').oninput=e=>{const q=e.target.value.trim().toLocaleLowerCase();if(!q){$('#results').innerHTML='';return}const lists=state.lists.filter(l=>Number.isFinite(searchScore(listPath(l.id),q))).sort((a,b)=>searchScore(listPath(a.id),q)-searchScore(listPath(b.id),q));const itemText=i=>[i.title,i.note||'',...(i.tags||[])].join(' ');const items=state.items.filter(i=>Number.isFinite(searchScore(itemText(i),q))).sort((a,b)=>searchScore(itemText(a),q)-searchScore(itemText(b),q));$('#results').innerHTML=(lists.length?'<div class="section-label">Listas</div>'+lists.map(l=>`<button class="search-result" data-result-list="${E(l.id)}"><span class="search-list-line">${listGlyph(l)}<span>${E(l.name)}</span></span><small>${E(locationName(l.parent))}</small></button>`).join(''):'')+(items.length?'<div class="section-label">Itens</div>'+items.map(i=>`<button class="search-result" data-result="${E(i.id)}">${E(i.title)}<small>${E(getList(i.list).name)}${i.done?' · Concluído':''}</small></button>`).join(''):'')||'<p class="hint-box">Nenhum resultado por aqui.</p>';utility.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{close(utility);openItem(b.dataset.result)});utility.querySelectorAll('[data-result-list]').forEach(b=>b.onclick=()=>{close(utility);navigate(b.dataset.resultList)})};setTimeout(()=>$('#searchInput')?.focus(),20)}
function listMenu(){if(view==='space'||view==='inbox'||view==='completed'){modal(utility,frame(getList(view).name,`<button class="menu-option" id="addHere">Nova lista</button><button class="menu-option" id="organizeHere">Organizar listas</button>`));wireClose(utility);$('#addHere').onclick=()=>{close(utility);newList()};$('#organizeHere').onclick=()=>organizeLists();return}editList(view)}
function settings(){modal(utility,frame('Seu espaço',`<h2 class="utility-title">Dados do protótipo</h2><p class="hint-box">Seus dados ficam neste navegador. Ainda não há conta, sincronização ou IA conectada. Você pode exportar uma cópia e importá-la em outro dispositivo.</p><button class="menu-option" id="settingsOrganize">Organizar listas</button><button class="menu-option" id="export">↓ Exportar meus dados</button><button class="menu-option" id="import">↑ Importar dados</button><input type="file" accept="application/json,.json" id="importFile" hidden><p class="save-status" style="line-height:1.8">Clareza · protótipo 0.1<br>Interface adaptada para celular, tablet e desktop.</p>`));wireClose(utility);$('#settingsOrganize').onclick=()=>organizeLists();$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([storageBlocked?(localStorage.getItem(key)||'{}'):JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='clareza-dados.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const s=JSON.parse(await e.target.files[0].text());const imported=migrate(s);if(!valid(imported))throw Error();const old=state;state=imported;storageBlocked=false;save();close(utility);navigate('inbox');toast('Dados importados',()=>state=old)}catch{toast('Esse arquivo não contém dados válidos do Clareza.')}}}

function editList(id,backToOrganizer=false){const l=state.lists.find(l=>l.id===id);if(!l||id==='inbox')return;const draft={name:l.name,parent:l.parent,format:l.format||'list'};const show=()=>{modal(utility,frame('Opções da lista',`<input class="list-name-input" id="renameList" aria-label="Nome da lista" maxlength="100" value="${E(draft.name)}"><button class="location-summary" id="changeLocation"><span>Dentro de</span><strong>${E(locationName(draft.parent))}</strong><span aria-hidden="true">⌄</span></button><div class="form-actions"><button class="primary-button" id="saveListName">Salvar</button></div><div class="list-options"><button class="menu-option" id="listFormat">${draft.format==='checklist'?'✓ Apresentação: checklist':'Apresentação: lista'}</button><button class="menu-option" id="createChild">Criar lista aqui</button><button class="menu-option" id="orderLists">Reordenar listas</button><button class="menu-option danger" id="removeList">Remover lista</button></div>`));wireClose(utility);$('#renameList').oninput=e=>draft.name=e.target.value;$('#changeLocation').onclick=()=>chooseLocation(draft.parent,id,parent=>{draft.parent=parent;show()},show);$('#saveListName').onclick=()=>{if(!draft.name.trim()){$('#renameList').focus();return}const snapshot=structuredClone(state);if(!setParent(id,draft.parent))return;l.name=draft.name.trim();l.format=draft.format;save();close(utility);if(backToOrganizer)organizeLists();toast('Lista atualizada',()=>state=snapshot)};$('#listFormat').onclick=()=>{draft.format=draft.format==='checklist'?'list':'checklist';show()};$('#createChild').onclick=()=>{close(utility);newList(id)};$('#orderLists').onclick=()=>organizeLists();$('#removeList').onclick=()=>removeListDialog(id)};show()}
function organizeLists(){const section=(parent)=>childrenOf(parent).map(l=>{const sib=childrenOf(parent),n=sib.findIndex(x=>x.id===l.id);return `<div class="organize-row" data-drop-list="${E(l.id)}"><button class="organize-name" data-edit-list="${E(l.id)}" draggable="true" data-drag-list="${E(l.id)}" aria-label="Opções da lista ${E(l.name)}"><span class="organize-list-title">${listGlyph(l)}<span>${E(l.name)}</span></span><small>${E(locationName(l.parent))}</small><span class="organize-chevron" aria-hidden="true">›</span></button><div class="order-controls"><button data-up="${E(l.id)}" ${n===0?'disabled':''} aria-label="Mover ${E(l.name)} para cima">↑</button><button data-down="${E(l.id)}" ${n===sib.length-1?'disabled':''} aria-label="Mover ${E(l.name)} para baixo">↓</button></div></div>`}).join('');modal(utility,frame('Organizar listas',`<p class="organize-description">Toque numa lista para mudar o nome, mover ou remover. Use as setas para ajustar a ordem.</p><div class="organize-tree"><section><h3>Meu espaço</h3>${section(null)}</section>${treeLists(null).filter(l=>childrenOf(l.id).length).map(l=>`<section><h3>${E(listPath(l.id))}</h3>${section(l.id)}</section>`).join('')}</div><button class="primary-button organize-create" id="organizeNew">Nova lista</button>`));wireClose(utility);utility.querySelectorAll('[data-edit-list]').forEach(b=>b.onclick=()=>editList(b.dataset.editList,true));const order=(id,n)=>{const top=$('.organize-tree').scrollTop,dialogTop=utility.scrollTop;nextOrder(id,n);organizeLists();const selector=n<0?'data-up':'data-down';const target=utility.querySelector('['+selector+'="'+CSS.escape(id)+'"]');const fallback=utility.querySelector('[data-edit-list="'+CSS.escape(id)+'"]');(target&&!target.disabled?target:fallback)?.focus({preventScroll:true});$('.organize-tree').scrollTop=top;utility.scrollTop=dialogTop};utility.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>order(b.dataset.up,-1));utility.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>order(b.dataset.down,1));$('#organizeNew').onclick=()=>{close(utility);newList()};wireListDrag(utility)}
function removeListDialog(id){const l=state.lists.find(l=>l.id===id);if(!l||id==='inbox')return;const target=l.parent;const hasContent=state.items.some(i=>i.list===id)||childrenOf(id).length>0;const apply=()=>{const snapshot=structuredClone(state);removeListData(id);if(view===id)view=target||'space';save();close(utility);toast('Lista removida. Conteúdo preservado.',()=>state=snapshot)};if(!hasContent){apply();return}modal(utility,frame('Remover lista',`<h2 class="utility-title">${E(l.name)}</h2><p class="removal-copy">${target?`Os itens e as listas contidas serão mantidos em <strong>${E(locationName(target))}</strong>.`:'Os itens irão para a Inbox. As listas contidas ficarão em Meu espaço.'} Nenhum lembrete será excluído.</p><div class="form-actions"><button class="secondary-button" id="cancelRemove">Manter lista</button><button class="primary-button" id="confirmRemove">Remover lista</button></div>`));wireClose(utility);$('#cancelRemove').onclick=()=>editList(id);$('#confirmRemove').onclick=apply}

function emptyState(id){return `<div class="empty-state"><strong>${id==='inbox'?'Inbox vazia':id==='completed'?'Nenhum item concluído':'Nenhum item por aqui.'}</strong></div>`}
function renderReview(){navigate('space')}
$('#capture').onclick=()=>captureDialog(null,true);$('#menuCapture').onclick=()=>captureDialog(null,true);$('#inlineAdd').onclick=()=>view==='space'?newList():captureDialog();$('#newList').onclick=()=>newList();$('#searchButton').onclick=search;$('#settings').onclick=settings;$('#more').onclick=listMenu;$('#navClose').onclick=()=>{document.body.classList.remove('nav-open');$('#veil').hidden=true;$('#menu').focus()};$('#menu').onclick=()=>{document.body.classList.toggle('nav-open');$('#veil').hidden=!document.body.classList.contains('nav-open')};$('#veil').onclick=()=>{document.body.classList.remove('nav-open');$('#veil').hidden=true};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!utility.open)search()}if(e.key==='Escape'&&!document.querySelector('dialog[open]')){document.body.classList.remove('nav-open');$('#veil').hidden=true}if(e.key==='n'&&!e.metaKey&&!e.ctrlKey&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!document.querySelector('dialog[open]')){e.preventDefault();captureDialog(null,true)}});window.addEventListener('storage',e=>{if(e.key===key){state=read(localStorage);render();if(editor.open)close(editor);toast('Atualizado a partir de outra aba')}});render();if(storageBlocked)toast('Não foi possível abrir os dados anteriores. Eles foram preservados.');

</script></body></html>
