</style><title>Clareza — seu espaço para pensar e fazer</title></head>
<body><div class="app"><aside id="sidebar" aria-label="Suas listas"><div class="brand"><span class="brand-mark">c</span> clareza<span class="version">protótipo</span></div><button class="search-trigger" id="searchButton"><span>⌕</span> Buscar em tudo <kbd>⌘ K</kbd></button><nav id="navigation"></nav><div class="sidebar-footer"><button id="newList">＋ Nova lista</button><button id="settings" aria-label="Opções e dados">···</button></div><div class="local-status"><span></span> Salvo neste dispositivo</div></aside><main id="main"><header class="topbar"><button class="icon-button mobile-menu" id="menu" aria-label="Abrir listas">☰</button><button class="icon-button" id="more" aria-label="Opções da lista">···</button></header><section class="content"><div class="page-heading"><div><div class="eyebrow" id="eyebrow">UM POUCO MAIS DE ESPAÇO NA CABEÇA</div><h1 id="pageTitle"></h1><p id="pageDescription"></p></div><div class="page-symbol" id="pageSymbol"></div></div><div id="filters"></div><div id="items"></div><button class="inline-add" id="inlineAdd">＋ <span>Adicionar algo</span></button><div class="quiet-footer" id="quietFooter"></div></section><button class="capture-fab" id="capture" aria-label="Capturar uma ideia">＋</button><div class="bottom-hint">Seu próximo passo pode começar com uma palavra.</div></main></div><div id="veil" hidden></div><dialog id="editor" aria-label="Detalhes do item"></dialog><dialog id="captureDialog" aria-label="Capturar"></dialog><dialog id="utility" aria-label="Opções"></dialog><div id="toast" role="status"></div><script type="module">const key='clareza.prototype.v1';
const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now()+Math.random());
function seed(){return {version:1,contextsReady:true,lists:[{id:'inbox',name:'Inbox',group:'inbox'},{id:'next',name:'Próximas ações',group:'next'},{id:'waiting',name:'Aguardando',group:'waiting'},{id:'someday',name:'Algum dia / Talvez',group:'someday'},{id:'rua',name:'Na rua',group:'next',parent:'next'},{id:'home',name:'Em casa',group:'next',parent:'next'},{id:'phone',name:'No telefone',group:'next',parent:'next'},{id:'computer',name:'No computador',group:'next',parent:'next'}],items:[]}}
function valid(s){if(!s||s.version!==1||!Array.isArray(s.lists)||!Array.isArray(s.items))return false;const ids=new Set();for(const l of s.lists){if(!l||typeof l.id!=='string'||typeof l.name!=='string'||ids.has(l.id))return false;ids.add(l.id)}if(!ids.has('inbox'))return false;for(const l of s.lists){if(l.parent){if(l.id==='inbox'||['next','projects','waiting','someday','reference'].includes(l.id)||l.parent==='inbox')return false;if(typeof l.parent!=='string'||!['next','projects','waiting','someday','reference'].includes(l.parent)&&!ids.has(l.parent))return false;let x=l,seen=new Set();while(x?.parent&&!['next','projects','waiting','someday','reference'].includes(x.parent)){if(seen.has(x.id))return false;seen.add(x.id);x=s.lists.find(y=>y.id===x.parent)}if(l.parent===l.id)return false}}const items=new Set();for(const i of s.items){if(!i||typeof i.id!=='string'||typeof i.title!=='string'||!ids.has(i.list)||items.has(i.id)||!Array.isArray(i.checklist)||i.checklist.some(c=>!c||typeof c.text!=='string'))return false;items.add(i.id)}return s.items.every(i=>!i.project||s.items.some(p=>p.id===i.project&&p.kind==='project'&&p.id!==i.id));}
function read(storage){try{const data=JSON.parse(storage.getItem(key));return valid(data)?data:seed()}catch{return seed()}}
function createItem(state,title,list='inbox',project=null){const i={id:uid(),title:title.trim(),list,note:'',checklist:[],done:false};if(project)i.project=project;state.items.push(i);return i}
function convertProject(item){item.kind='project';delete item.project;return item}
function inView(item,view){return matches(item,view)}

const $=s=>document.querySelector(s), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=migrate(read(localStorage)),view='inbox',selected=null,filter='all',timer,previousFocus;

const groupNames={next:'Próximas ações',projects:'Projetos',waiting:'Aguardando',someday:'Algum dia / Talvez',reference:'Referência'};
function migrate(data){for(const l of data.lists){if(!l.group)l.group=l.id==='rua'||l.id==='ana'?'next':l.id==='ideas'?'someday':['inbox','next','waiting','someday'].includes(l.id)?l.id:'reference';if(!['inbox','next','projects','waiting','someday','reference'].includes(l.id)&&!l.parent)l.parent=l.group}if(!data.contextsReady){for(const [id,name] of [['home','Em casa'],['phone','No telefone'],['computer','No computador']])if(!data.lists.some(l=>l.id===id))data.lists.push({id,name,group:'next',parent:'next'});data.contextsReady=true}return data}
function groupOf(id){if(isRoot(id))return id;const visited=new Set();while(id&&!visited.has(id)){visited.add(id);const l=state.lists.find(l=>l.id===id);if(!l)return 'reference';id=l.parent||l.group;if(isRoot(id))return id}return 'reference'}
function isRoot(id){return Object.hasOwn(groupNames,id)}
function members(group){return treeLists(group)}

function childrenOf(parent){return state.lists.filter(l=>!isRoot(l.id)&&l.id!=='inbox'&&(l.parent||l.group)===parent)}
function treeLists(parent,seen=new Set()){if(seen.has(parent))return [];seen.add(parent);return childrenOf(parent).flatMap(l=>[l,...treeLists(l.id,seen)])}
function isWithin(id,parent){if(id===parent)return true;const visited=new Set();while(id&&!visited.has(id)){visited.add(id);const l=state.lists.find(l=>l.id===id);id=l?.parent||l?.group;if(id===parent)return true;if(isRoot(id))return false}return false}
function listDepth(id){let n=0,seen=new Set();while(!isRoot(id)&&id!=='inbox'&&!seen.has(id)){seen.add(id);id=state.lists.find(l=>l.id===id)?.parent;n++;if(!id)break}return n}
function listPath(id){const names=[],seen=new Set();while(id&&!seen.has(id)){seen.add(id);names.unshift(getList(id).name||'Lista');if(isRoot(id)||id==='inbox')break;id=state.lists.find(l=>l.id===id)?.parent||groupOf(id)}return names.join(' / ')}
function locationName(id){return getList(id).name||'Lista'}
function destinationOptions(group){return [{id:group,name:group==='next'?'Sem contexto':groupNames[group]},...treeLists(group).map(l=>({id:l.id,name:'　'.repeat(Math.max(0,listDepth(l.id)-1))+l.name}))]}
function removeListData(id){const l=state.lists.find(l=>l.id===id);if(!l||isRoot(id)||id==='inbox')return null;const target=l.parent||l.group;if(!state.lists.some(x=>x.id===target)&&isRoot(target))state.lists.push({id:target,name:groupNames[target],group:target});state.items.filter(i=>i.list===id).forEach(i=>i.list=target);childrenOf(id).forEach(c=>c.parent=target);state.lists=state.lists.filter(x=>x.id!==id);return target}
function nextOrder(id,direction){const l=state.lists.find(l=>l.id===id);if(!l)return;const sib=childrenOf(l.parent||l.group),n=sib.findIndex(x=>x.id===id),other=sib[n+direction];if(!other)return;const a=state.lists.indexOf(l),b=state.lists.indexOf(other);[state.lists[a],state.lists[b]]=[state.lists[b],state.lists[a]];save()}
function setParent(id,parent){if(id===parent||isWithin(parent,id))return false;const l=state.lists.find(l=>l.id===id);if(!l)return false;l.parent=parent;for(const child of [l,...treeLists(id)])child.group=groupOf(child.id);return true}
function chooseLocation(current,exclude,onPick,onBack){const forbidden=id=>exclude&&(id===exclude||isWithin(id,exclude));modal(utility,frame('Onde esta lista fica?',`<button class="location-back" id="locationBack">← Voltar</button><div class="location-list">${Object.entries(groupNames).map(([g,name])=>`<button class="location-option location-root ${current===g?'chosen':''}" data-location="${g}"><span class="nav-icon">${glyph(g)}</span><span>${name}</span>${current===g?'<span class="location-check">✓</span>':''}</button>${treeLists(g).filter(l=>!forbidden(l.id)).map(l=>`<button class="location-option ${current===l.id?'chosen':''}" style="--depth:${listDepth(l.id)}" data-location="${E(l.id)}"><span>${E(l.name)}</span>${current===l.id?'<span class="location-check">✓</span>':''}</button>`).join('')}`).join('')}</div>`));wireClose(utility);$('#locationBack').onclick=onBack;utility.querySelectorAll('[data-location]').forEach(b=>b.onclick=()=>onPick(b.dataset.location))}

function matches(i,id){if(id==='completed')return !!i.done;if(i.done)return false;const g=groupOf(i.list);if(id==='projects')return i.kind==='project'&&g!=='someday'&&g!=='waiting';if(id==='next'||id==='all')return i.kind!=='project'&&g==='next';if(id==='waiting'||id==='someday'||id==='reference')return g===id;return (i.list===id||isWithin(i.list,id))&&(i.kind!=='project'||g!=='next')}
function glyph(id){const shape={inbox:'<path d="M5 4h14v9h-3l-2 3h-4l-2-3H5V4Zm-3 9h4l2 5h8l2-5h4v8H2v-8Z"/>',next:'<path d="m13 2-9 12h7l-1 8L20 9h-7l1-7Z"/>',projects:'<path d="M3 5h7l2 3h9v13H3V5Z"/>',waiting:'<path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1 4h2v6l4 3-1 2-5-4V6Z"/>',someday:'<path d="M6 19a5 5 0 0 1-1-10 7 7 0 0 1 13-1 5.5 5.5 0 0 1 0 11H6Z"/>',reference:'<path d="M4 3h7v18H4V3Zm9 0h7v18h-7V3Z"/>',context:'<path d="M4 4h16v4H4V4Zm0 6h16v4H4v-4Zm0 6h16v4H4v-4Z"/>'};return `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${shape[id]||shape.context}</svg>`}

const editor=$('#editor'),utility=$('#utility'),capture=$('#captureDialog');
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{toast('Não foi possível salvar. Exporte seus dados.')}render()}
function toast(message,undo){clearTimeout(timer);$('#toast').innerHTML=`<span>${E(message)}</span>${undo?'<button>Desfazer</button>':''}`;$('#toast').classList.add('show');if(undo)$('#toast button').onclick=()=>{undo();save();$('#toast').classList.remove('show')};timer=setTimeout(()=>$('#toast').classList.remove('show'),6000)}
function modal(el,html){previousFocus=document.activeElement;el.innerHTML=html;el.showModal()}
function close(el){el.close();previousFocus?.focus?.()}
function frame(label,body){return `<div class="dialog-top"><span class="dialog-label">${label}</span><button class="icon-button" data-close aria-label="Fechar">×</button></div><div class="dialog-body">${body}</div>`}
function wireClose(el){el.querySelector('[data-close]').onclick=()=>close(el)}
function navigate(id){view=id;filter='all';document.body.classList.remove('nav-open');$('#veil').hidden=true;render();$('#main').scrollIntoView({block:'start'})}
const special={projects:{name:'Projetos',icon:'◉',description:'Resultados que você se comprometeu a alcançar.'},completed:{name:'Concluídos',icon:'✓',description:'O que você já tirou do caminho.'},review:{name:'Revisar',icon:'↻',description:'Um momento para deixar seu sistema em dia.'}};
function getList(id){if(id.startsWith('project:'))return state.items.find(i=>i.id===id.slice(8))||{name:'Projeto'};return isRoot(id)?{id,name:groupNames[id]}:state.lists.find(l=>l.id===id)||special[id]||state.lists[0]}
function navItem(id){const l=getList(id),n=state.items.filter(i=>matches(i,id)).length;const depth=isRoot(id)||id==='inbox'||special[id]?0:listDepth(id);return `<button class="nav-item ${depth?'nested-list':''} ${view===id?'active':''}" style="--depth:${depth}" data-nav="${E(id)}" ${view===id?'aria-current="page"':''} title="${E(l.name)}"><span class="nav-icon">${glyph(id)}</span><span>${E(l.name)}</span>${n?`<span class="nav-count">${n}</span>`:''}</button>`}
function render(){const list=getList(view);$('#pageTitle').textContent=list.title||list.name;$('#pageSymbol').innerHTML=glyph(view.startsWith('project:')?'projects':isRoot(view)?view:view==='inbox'?'inbox':'context');$('#navigation').innerHTML=navItem('inbox')+Object.keys(groupNames).map(g=>`<section class="nav-section ${groupOf(view)==g||g==='projects'&&view.startsWith('project:')?'contains-current':''}"><div class="group-heading"><button class="group-link ${view===g?'active':''}" data-nav="${g}" ${view===g?'aria-current="page"':''}><span class="nav-icon group-icon">${glyph(g)}</span><span class="nav-label">${groupNames[g]}</span><span class="nav-count">${state.items.filter(i=>matches(i,g)).length||''}</span></button></div>${treeLists(g).map(l=>navItem(l.id)).join('')}${g==='projects'?state.items.filter(i=>matches(i,'projects')).map(i=>`<button class="nav-item project-nav ${view==='project:'+i.id?'active':''}" data-project="${E(i.id)}" ${view==='project:'+i.id?'aria-current="page"':''} title="${E(i.title)}"><span>${E(i.title)}</span></button>`).join(''):''}</section>`).join('')+'<div class="nav-tools">'+navItem('review')+navItem('completed')+'</div>';$('#navigation').querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));$('#navigation').querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{document.body.classList.remove('nav-open');$('#veil').hidden=true;openItem(b.dataset.project)});$('#filters').innerHTML='';if(view==='review'){renderReview();return}if(view.startsWith('project:')){renderProject(view.slice(8));return}const items=state.items.filter(i=>matches(i,view));const children=childrenOf(view);const childLinks=children.length?`<div class="child-lists" aria-label="Sublistas">${children.map(l=>`<button class="child-list" data-child="${E(l.id)}"><span>${E(l.name)}</span><span class="child-meta">${state.items.filter(i=>matches(i,l.id)).length||''}<span aria-hidden="true">›</span></span></button>`).join('')}</div>`:'';let body='';if((isRoot(view)&&view!=='projects')||children.length){const buckets=[{id:view,name:isRoot(view)?view==='next'?'Sem contexto':'Sem lista':'Nesta lista'},...treeLists(view)];body=items.length?buckets.map(l=>{const rows=items.filter(i=>i.list===l.id);return rows.length?`<section class="context-section"><button class="context-title" data-context="${E(l.id)}">${E(l.name)}<span>${rows.length}</span></button>${rows.map(row).join('')}</section>`:''}).join(''):children.length?'':emptyState(view)}else body=items.length?items.map(row).join(''):emptyState(view);const welcome=view==='inbox'&&!state.setupDismissed&&state.items.length===0?`<section class="setup-note"><span class="setup-kicker">COMECE DO SEU JEITO</span><h2>Um lugar para tirar as coisas da cabeça.</h2><p>Já deixamos alguns contextos prontos. Você pode adaptar as listas agora ou começar capturando.</p><div><button id="setupLists">Ajustar minhas listas <span aria-hidden="true">→</span></button><button id="setupLater">Agora não</button></div></section>`:'';$('#items').innerHTML=welcome+(children.length&&(!isRoot(view)||!items.length)?childLinks:'')+(welcome?'':body);if($('#setupLists'))$('#setupLists').onclick=()=>organizeLists();if($('#setupLater'))$('#setupLater').onclick=()=>{state.setupDismissed=true;save()};$('#items').querySelectorAll('[data-child]').forEach(b=>b.onclick=()=>navigate(b.dataset.child));$('#items').querySelectorAll('[data-context]').forEach(b=>b.onclick=()=>{if(b.dataset.context!==view)navigate(b.dataset.context)});wireRows($('#items'));$('#inlineAdd').hidden=view==='completed';$('#inlineAdd span').textContent=view==='projects'?'Adicionar um resultado':children.length?'Adicionar nesta lista':'Adicionar algo';$('#quietFooter').textContent=''}
function dateMeaning(kind){return ({appointment:'Em',deadline:'Prazo',review:'Rever em'})[kind]||'Em'}
function row(i){const p=state.items.find(x=>x.id===i.project);const children=state.items.filter(x=>x.project===i.id&&!x.done);return `<div class="task-row ${i.done?'done':''}" data-item="${E(i.id)}"><button class="check ${i.kind==='project'?'project-check':''} ${i.done?'checked':''}" data-check="${E(i.id)}" aria-label="${i.done?'Reabrir':'Concluir'} ${E(i.title)}">${i.done?'✓':''}</button><button class="task-open" data-open="${E(i.id)}"><span class="task-title">${E(i.title)}</span>${p&&view!=='project:'+p.id?`<span class="task-sub">${E(p.title)}</span>`:i.kind==='project'?`<span class="task-sub">${children.length} ${children.length===1?'ação em aberto':'ações em aberto'}</span>`:''}</button><span class="task-indicators">${i.date?`<span class="row-date">${E(dateMeaning(i.dateKind))} ${E(new Date(i.date+'T12:00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'short'}))}</span>`:''}${i.note?'<span title="Contém nota" aria-label="Contém nota">≡</span>':''}${i.checklist.length?`<span title="Checklist">${i.checklist.filter(c=>c.done).length}/${i.checklist.length}</span>`:''}</span></div>`}
function wireRows(el){el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openItem(b.dataset.open));el.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>complete(b.dataset.check))}
function complete(id){const i=state.items.find(i=>i.id===id);const old=i.done;i.done=!old;save();toast(i.done?'Concluído':'Item reaberto',()=>i.done=old);if(editor.open&&selected===id)drawEditor()}
function openItem(id){const item=state.items.find(i=>i.id===id);if(item?.kind==='project'){if(editor.open)editor.close();navigate('project:'+id);return}selected=id;drawEditor(true)}

function captureDialog(project=null,globalCapture=false,source=null){if(!globalCapture&&!project&&view.startsWith('project:'))project=view.slice(8);const parent=state.items.find(i=>i.id===project);const g=globalCapture?'inbox':parent||source?'next':isRoot(view)?view:groupOf(view);const options=destinationOptions(g);const list=globalCapture?'inbox':parent||source?'next':state.lists.some(l=>l.id===view)?view:isRoot(view)?view:'inbox';modal(capture,frame(source?'Acompanhar espera':parent?'Nova ação relacionada':globalCapture?'Capturar na Inbox':'Adicionar aqui',`<textarea class="capture-input" id="captureText" placeholder="O que está na sua cabeça?" aria-label="O que capturar" autofocus></textarea>${!globalCapture&&(isRoot(view)||parent||source)?`<label class="field-label" for="captureList">${g==='next'?'Contexto':'Lista'}</label><select id="captureList">${options.map(l=>`<option value="${E(l.id)}">${E(l.name)}</option>`).join('')}</select>`:''}<div class="capture-bottom"><span>${globalCapture?'Na Inbox':!isRoot(view)&&!parent?'Em '+E(getList(list).name):''}</span><button class="primary-button" id="saveCapture">Guardar ↵</button></div>`));wireClose(capture);function commit(){const text=$('#captureText').value.trim();if(!text){$('#captureText').focus();return}const dest=$('#captureList')?.value||list;if(!state.lists.some(l=>l.id===dest))state.lists.push({id:dest,name:groupNames[dest]||dest,group:dest});const i=createItem(state,text,dest,project);if(source)i.follows=source.id;if(g==='projects'&&!parent)convertProject(i);save();close(capture);if(parent&&editor.open)drawEditor();toast(globalCapture?'Guardado na Inbox':parent?'Ação adicionada':'Guardado')};$('#saveCapture').onclick=commit;$('#captureText').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commit()}};setTimeout(()=>$('#captureText')?.focus(),30)}

function removeListDialog(id){const l=state.lists.find(l=>l.id===id);if(!l)return;const target=l.parent||l.group;const hasContent=state.items.some(i=>i.list===id)||childrenOf(id).length>0;const apply=()=>{const snapshot=structuredClone(state);removeListData(id);if(view===id)view=target;save();close(utility);toast('Lista removida. Conteúdo preservado.',()=>state=snapshot)};if(!hasContent){apply();return}modal(utility,frame('Remover lista',`<h2 class="utility-title">${E(l.name)}</h2><p class="removal-copy">Os itens e as sublistas serão mantidos em <strong>${E(locationName(target))}</strong>. Nenhum lembrete será excluído.</p><div class="form-actions"><button class="secondary-button" id="cancelRemove">Manter lista</button><button class="primary-button" id="confirmRemove">Remover lista</button></div>`));wireClose(utility);$('#cancelRemove').onclick=()=>editList(id);$('#confirmRemove').onclick=apply}
